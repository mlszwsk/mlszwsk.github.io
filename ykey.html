	/* --- Global Table Styles --- */
.main-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  border-radius: 12px;
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
}

.main-table th,
.main-table td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid #f0f0f0;
}

.main-table tr:hover {
  background-color: #f9fafb;
}

.hide {
  display: none;
}

/* --- Textarea Styling --- */
textarea {
  width: 100%;
  min-height: 30px;
  padding: 6px 8px;
  font-size: 0.9rem;
  border: 1px solid #ccc;
  border-radius: 6px;
  resize: vertical;
  transition: border-color 0.2s ease;
}

textarea:focus {
  border-color: #4f46e5;
  outline: none;
  box-shadow: 0 0 4px rgba(79, 70, 229, 0.3);
}

/* --- Buttons --- */
.icon-btn {
  background: #f3f4f6;
  border: none;
  padding: 6px 10px;
  margin: 0 2px;
  cursor: pointer;
  font-size: 1.1rem;
  border-radius: 6px;
  transition: background 0.2s ease, transform 0.1s ease;
}

.icon-btn:hover {
  background: #e5e7eb;
  transform: scale(1.05);
}

.icon-btn.success {
  background: #10b981;
  color: white;
}

.icon-btn.success:hover {
  background: #059669;
}

.icon-btn.danger {
  background: #ef4444;
  color: white;
}

.icon-btn.danger:hover {
  background: #dc2626;
}

.icon-btn.warn {
  background: rgb(234 179 8 / var(--tw-bg-opacity, 1));
  color: white;
}

.icon-btn.warn:hover {
  background: rgb(202 138 4 / var(--tw-bg-opacity, 1));
}
